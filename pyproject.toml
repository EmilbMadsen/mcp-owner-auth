[project]
name = "mcp-owner-auth"
version = "0.1.1"
description = "Single-user OAuth 2.1 (password + TOTP) for self-hosted MCP servers used from claude.ai"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Emil Madsen" }]
requires-python = ">=3.13"
keywords = ["mcp", "model-context-protocol", "oauth", "totp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "mcp>=2.3.0",
    "pyotp>=2.12.0",
    "qrcode>=8.2",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/EmilbMadsen/mcp-owner-auth"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
